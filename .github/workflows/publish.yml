name: 🚀 Publish Package

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: read

# THIS JOB RUNS THE LIVE MAIL SUITE, SO IT JOINS THE LIVE MAIL GROUP
# ------------------------------------------------------------------
# `npm run test:all` below includes the 34 live SMTP/IMAP tests, against the
# same shared mailbox `integration.yml` uses. Until now this workflow declared
# no concurrency at all, so a release could run that suite alongside a
# `📬 Live Mail Integration` run — and did. On 2026-08-12 this job (run
# 31577198070, 08:11:16–08:35:08) overlapped integration run 31576927510
# (08:07:35–08:32:45) on the same mailbox, and failed with
# "expected [] to have a length of 1 but got +0": its message was received and
# then deleted out from under it, mid-test, by the other run's unfiltered
# clean. The suite's own serialisation was working correctly — this workflow
# simply was not part of it.
#
# THE TRADE-OFF, STATED PLAINLY. GitHub keeps at most ONE pending run per
# concurrency group: if a publish is queued behind a live run and a newer live
# run is then queued, the pending publish is cancelled. That risk is real, and
# it is the reason this workflow was previously left out of the group.
#
# It is the right trade anyway:
#   * the failure it prevents has already happened, and cost a release;
#   * the failure it introduces is recoverable in one click — a cancelled
#     publish has published nothing, the tag is untouched, and re-running the
#     workflow from the Actions UI republishes the same version;
#   * `cancel-in-progress: false` guarantees a publish that has STARTED is
#     never interrupted, so no release can be cut off mid-publish;
#   * the exposure window is small: live runs are triggered by same-repo PRs
#     touching the client, plus one nightly cron at 03:00 UTC.
#
# The per-run isolation in tests/email-integration.spec.ts also lowers the
# stake on both sides — an overlap is no longer catastrophic, and this group is
# now belt to that braces rather than the only thing standing between a release
# and someone else's clean().
#
# Keep this group key identical to the one in integration.yml. Two different
# constants serialise nothing.
concurrency:
  group: live-mail-integration
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The live SMTP/IMAP suite runs here, so this job is exposed to the mail
    # provider's latency. Without an explicit bound a genuine hang inherits
    # GitHub's 360-minute default and burns six hours of runner time before
    # anyone sees a red build.
    #
    # Deriving 90 from measurements rather than taste:
    #   * observed full live run, before the budgets were doubled: 1166s
    #     (~19.4 min), on a slow day for the provider;
    #   * doubling the waits does NOT slow a passing test — it returns as soon
    #     as the mail lands — so a good run stays in that range;
    #   * a genuinely slow-but-passing day at roughly twice that pace is
    #     ~40 min, plus ~2 min of install and build;
    #   * a legitimately slow test can now sit near its own budget: the
    #     clean-verify test alone is allowed ~9.25 min, the archive test
    #     ~14.25 min. Two or three of those on one run fit inside 90.
    # 90 is therefore comfortably above the worst plausible PASSING run while
    # still roughly a third of the pathological ceiling (every test burning its
    # full budget is ~4.3 hours) — that shape is a hang and should be killed. A
    # bound that kills a slow-but-passing run would just recreate the failure
    # this PR fixes, wearing a hang's clothes.
    timeout-minutes: 90

    steps:
      - name: 🗂️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: 🧩 Install dependencies
        run: npm ci

      - name: 🛠️ Build package
        run: npm run build

      - name: 🧪 Run All Tests (unit + integration)
        run: npm run test:all
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_SMTP_HOST: ${{ secrets.SENDER_SMTP_HOST }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}

      - name: 📝 Check Types
        run: npx tsc --noEmit

      - name: 📦 Publish Package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
