name: 🚀 Publish Package

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The live SMTP/IMAP suite runs here. Without an explicit bound a genuine
    # hang inherits GitHub's 360-minute default and burns six hours of runner
    # time before anyone sees a red build.
    #
    # Sizing: a passing test returns as soon as the mail lands, so the doubled
    # per-test waits do not slow a good run — the last full run took ~16
    # minutes. The cost only appears on slow or failing tests, each of which
    # can now burn up to 240s instead of 120s. 90 minutes covers a normal run
    # plus roughly ten fully-expired long waits. It is deliberately NOT sized
    # to the pathological ceiling (every one of the 34 tests burning its whole
    # budget is ~3.5 hours) — a run like that is a genuine hang and should be
    # killed. A bound that kills a legitimately slow-but-passing run would
    # just recreate the failure this PR fixes, wearing a hang's clothes.
    timeout-minutes: 90

    steps:
      - name: 🗂️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: 🧩 Install dependencies
        run: npm ci

      - name: 🛠️ Build package
        run: npm run build

      - name: 🧪 Run All Tests (unit + integration)
        run: npm run test:all
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_SMTP_HOST: ${{ secrets.SENDER_SMTP_HOST }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}

      - name: 📝 Check Types
        run: npx tsc --noEmit

      - name: 📦 Publish Package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
