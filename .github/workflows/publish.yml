name: 🚀 Publish Package

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The live SMTP/IMAP suite runs here. Without an explicit bound a genuine
    # hang inherits GitHub's 360-minute default and burns six hours of runner
    # time before anyone sees a red build. The full suite (unit + 34 live
    # integration tests) has been landing in ~16 minutes; 45 leaves room for a
    # slow mail day while still failing fast on a real hang.
    timeout-minutes: 45

    steps:
      - name: 🗂️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: 🧩 Install dependencies
        run: npm ci

      - name: 🛠️ Build package
        run: npm run build

      - name: 🧪 Run All Tests (unit + integration)
        run: npm run test:all
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_SMTP_HOST: ${{ secrets.SENDER_SMTP_HOST }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}

      - name: 📝 Check Types
        run: npx tsc --noEmit

      - name: 📦 Publish Package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
