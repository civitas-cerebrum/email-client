name: 📬 Live Mail Integration

# WHY THIS EXISTS
# ---------------
# `test.yml` runs `npm test`, which is unit-only. The 34 live SMTP/IMAP tests
# used to run ONLY inside the publish workflow — i.e. after merge, with a
# release already in flight. A mail-dependency upgrade could therefore reach a
# release without ever having been exercised against a real mail server, and
# the first signal was a failed publish.
#
# This workflow moves that signal before the merge:
#   * on same-repo PRs that touch the client source or the mail dependencies;
#   * nightly on main, so dependency/server drift is caught even when nobody
#     is touching those paths;
#   * on demand via workflow_dispatch.
#
# FORKS
# -----
# GitHub does not expose secrets to workflows triggered by pull requests from
# forks, so this job would fail for every outside contributor through no fault
# of theirs. The job is therefore gated on the PR head coming from this same
# repository; on a fork PR it is SKIPPED (neutral), never failed. We do not use
# `pull_request_target` — that would run untrusted PR code with access to live
# mailbox credentials. Maintainers can validate a fork PR by pushing its branch
# to this repo or by running this workflow via workflow_dispatch.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/email-integration.spec.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'
  schedule:
    # 03:00 UTC daily — off-peak, and far from typical release windows.
    - cron: '0 3 * * *'
  workflow_dispatch:

# SERIALISATION — DEFENCE IN DEPTH, NOT THE ONLY DEFENCE
# ------------------------------------------------------
# The suite sends real mail to one shared mailbox, so two runs of it against
# that mailbox must not overlap.
#
# The primary defence is now in the suite itself: every message it sends is
# stamped with a per-run tag, every search and delete is scoped to that tag,
# and the one test that deletes without a filter operates on a folder it
# created and owns (see tests/email-integration.spec.ts). This group is the
# second line — it protects against whatever the suite grows next, and against
# mailbox-wide effects (quota, throttling) that no amount of per-message
# scoping can isolate.
#
# THE GROUP KEY IS A CONSTANT, DELIBERATELY. Do not interpolate github.ref,
# github.head_ref, github.workflow or anything else run-varying into it: a key
# that varies per ref puts every branch in its own group, which is the same as
# having no group at all. `publish.yml` declares this identical constant so a
# release's live suite serialises against this one.
#
# Verified working: run 31577074789 (pull_request) was created at 08:09:28 and
# its job did not start until 08:32:48 — three seconds after run 31576927510's
# job completed at 08:32:45. The two runs' *run-level* windows overlapped only
# because the second was queued by this group for 23 minutes.
concurrency:
  group: live-mail-integration
  cancel-in-progress: false

jobs:
  integration:
    name: 🧪 Live SMTP/IMAP suite
    runs-on: ubuntu-latest
    # Same suite as the publish job — same sizing rationale (see publish.yml).
    timeout-minutes: 90
    # Same-repo PRs only (secrets are unavailable to fork PRs); schedule and
    # manual dispatch always run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: 🗂️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🧩 Install dependencies
        run: npm ci

      - name: 🛠️ Build package
        run: npm run build

      - name: 📬 Run live integration tests
        run: npm run test:e2e
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_SMTP_HOST: ${{ secrets.SENDER_SMTP_HOST }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}
