name: 📬 Live Mail Integration

# WHY THIS EXISTS
# ---------------
# `test.yml` runs `npm test`, which is unit-only. The 34 live SMTP/IMAP tests
# used to run ONLY inside the publish workflow — i.e. after merge, with a
# release already in flight. A mail-dependency upgrade could therefore reach a
# release without ever having been exercised against a real mail server, and
# the first signal was a failed publish.
#
# This workflow moves that signal before the merge:
#   * on same-repo PRs that touch the client source or the mail dependencies;
#   * nightly on main, so dependency/server drift is caught even when nobody
#     is touching those paths;
#   * on demand via workflow_dispatch.
#
# FORKS
# -----
# GitHub does not expose secrets to workflows triggered by pull requests from
# forks, so this job would fail for every outside contributor through no fault
# of theirs. The job is therefore gated on the PR head coming from this same
# repository; on a fork PR it is SKIPPED (neutral), never failed. We do not use
# `pull_request_target` — that would run untrusted PR code with access to live
# mailbox credentials. Maintainers can validate a fork PR by pushing its branch
# to this repo or by running this workflow via workflow_dispatch.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/email-integration.spec.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'
  schedule:
    # 03:00 UTC daily — off-peak, and far from typical release windows.
    - cron: '0 3 * * *'
  workflow_dispatch:

# The suite sends real mail to one shared mailbox and one of its tests calls
# clean() with no filters, which deletes everything in the INBOX. Two runs
# overlapping would delete each other's fixtures, so runs are serialised.
concurrency:
  group: live-mail-integration
  cancel-in-progress: false

jobs:
  integration:
    name: 🧪 Live SMTP/IMAP suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same-repo PRs only (secrets are unavailable to fork PRs); schedule and
    # manual dispatch always run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: 🗂️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🧩 Install dependencies
        run: npm ci

      - name: 🛠️ Build package
        run: npm run build

      - name: 📬 Run live integration tests
        run: npm run test:e2e
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_SMTP_HOST: ${{ secrets.SENDER_SMTP_HOST }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}
